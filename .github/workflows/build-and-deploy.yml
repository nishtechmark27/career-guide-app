name: CI/CD Build Android APK, AAB & Deploy Live Application

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. BUILD ANDROID APK & AAB (PLAY STORE READY)
  # ---------------------------------------------------------------------------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant Execute Permissions for gradlew
        run: chmod +x android/gradlew

      # Build Debug APK (Directly installable on any Android phone)
      - name: Build Installable Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Build Release AAB (Android App Bundle for Google Play Store)
      - name: Build Play Store Android AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p build-artifacts
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} build-artifacts/CareerGuide-v1.0.apk \;
          find android/app/build/outputs/bundle -name "*.aab" -exec cp {} build-artifacts/CareerGuide-v1.0.aab \;
          ls -la build-artifacts/

      # Upload Artifacts to GitHub Actions Run for 1-click direct download
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CareerGuide-Android-APK
          path: build-artifacts/CareerGuide-v1.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: CareerGuide-Android-AAB
          path: build-artifacts/CareerGuide-v1.0.aab
          if-no-files-found: error
          retention-days: 30

      # Create Automated GitHub Release with Download Links
      - name: Create Automated GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Career Guide Mobile App v1.0.${{ github.run_number }}
          body: |
            ## 📱 Career Guide Mobile App — Release v1.0.${{ github.run_number }}
            
            ### 📥 Download Links:
            - **[📲 Download Android APK](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/CareerGuide-v1.0.apk)** (Directly installable on any Android phone)
            - **[📦 Download Play Store AAB](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/CareerGuide-v1.0.aab)** (For Google Play Console submission)
            
            ### 🌐 Live Web App:
            - [https://${{ github.repository_owner }}.github.io/career-guide-app/](https://${{ github.repository_owner }}.github.io/career-guide-app/)
          files: |
            build-artifacts/CareerGuide-v1.0.apk
            build-artifacts/CareerGuide-v1.0.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 2. DEPLOY LIVE WEB APPLICATION TO GITHUB PAGES
  # ---------------------------------------------------------------------------
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
